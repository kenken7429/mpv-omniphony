name: master-beta

# Shipping master-tracking build of mpv-omniphony: mpv master + the orender
# spatial-audio patches, with native Dolby Vision Profile 7 FEL.
#
# As of 2026-07-01 FEL is UPSTREAM (mpv PR #17932 merged; libplacebo + ffmpeg
# carry it in their masters), so there is no fork/patch to track — this build is
# just "mpv master + orender". It still builds two deps from source because no
# release ships the FEL API yet: libplacebo master (PL_API_VER >= 370) and ffmpeg
# master (dovi_split BSF + DoVi stream group). See deps-fel/pins-fel.env and the
# "Dolby Vision FEL" section of README.md. scripts/build-fel-deps.sh builds them
# into a prefix; the mpv build links that prefix FIRST so it shadows the
# system/Martchus ffmpeg+libplacebo.
#
# Opt-in / prerelease channel: this does NOT touch integration-build.yml /
# release.yml (the stable v0.41.0 track).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC
  push:
    # Tag a beta (e.g. v0.4.0-fel-beta.1) to build AND publish a pre-release.
    # (The -fel tag namespace is the established prerelease channel; kept for
    # release-process continuity even though FEL is no longer a fork.)
    tags:
      - 'v*-fel*'
    paths:
      - 'patches-master/**'
      - 'deps-fel/**'
      - 'scripts/build-fel-deps.sh'
      - 'scripts/build-libbluray-bdj.sh'
      - 'scripts/build-libbluray-mingw.sh'
      - 'scripts/mpv-bdj-launcher-macos.sh'
      - 'scripts/MPV-BD菜单启动.bat'
      - 'scripts/BD_J_运行说明.txt'
      - 'scripts/apply-patches-master.sh'
      - '.github/workflows/build-master-beta.yml'

env:
  # Rolling (cron/dispatch/path-push) builds track Omniphony main; a tagged beta
  # pins liborender to the matching release line for reproducibility.
  OMNIPHONY_REF: ${{ startsWith(github.ref, 'refs/tags/') && 'v0.5.0' || 'main' }}
  # Java LTS used for BD-J (libbluray.jar compile + jlink runtime bundled on
  # macOS/Linux). Temurin 21 LTS ships on all runners. BDJ is tied to the
  # libbluray source build — it can't use distro/homebrew libbluray (those
  # ship bdj_jar=disabled by default).
  JAVA_VERSION: '21'
  JAVA_DISTRO: 'temurin'

jobs:
  resolve-libplacebo:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - id: r
        run: |
          # Read the pinned commit from deps-fel/pins-fel.env — we pin to a
          # known-good version (41ac2980 = v7.371.0) because newer libplacebo
          # crashes on macOS MoltenVK. When we unpin, revert to ls-remote.
          source deps-fel/pins-fel.env
          sha="$LIBPLACEBO_REF"
          echo "libplacebo pinned ref = $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: resolve-libplacebo
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (mpv + FEL Vulkan stack)
        run: |
          brew update
          # We build our OWN libplacebo (master) + ffmpeg (master) from source,
          # so do NOT brew-install libplacebo/ffmpeg (they would clash on
          # PKG_CONFIG_PATH). molten-vk + vulkan-loader/-headers give the
          # Vulkan-on-Metal stack libplacebo's FEL path needs; cargo-c builds
          # libdovi (so build-fel-deps.sh skips its own `cargo install cargo-c`).
          # NOTE: removed `libbluray` — rebuilt from source with BD-J below.
          brew install meson ninja pkg-config cargo-c \
            libass luajit lcms2 shaderc glslang \
            molten-vk vulkan-headers vulkan-loader \
            libdvdnav libdvdread \
            opus fontconfig freetype libxml2

      - name: Setup JDK (for BD-J libbluray.jar compile + jlink runtime bundle)
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: aarch64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache FEL dep prefix
        id: felcache
        uses: actions/cache@v5
        with:
          path: fel-prefix
          key: fel-macos-${{ needs.resolve-libplacebo.outputs.sha }}-${{ hashFiles('deps-fel/**', 'scripts/build-fel-deps.sh') }}

      - name: Build FEL deps (libdovi + libplacebo master + ffmpeg master)
        if: steps.felcache.outputs.cache-hit != 'true'
        run: |
          # Make the brew Vulkan/shaderc/lcms visible so libplacebo's meson probes
          # resolve them; build-fel-deps.sh prepends its own prefix ahead of these.
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig:$(brew --prefix shaderc)/lib/pkgconfig:$(brew --prefix lcms2)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          PREFIX="$GITHUB_WORKSPACE/fel-prefix" WORK="$GITHUB_WORKSPACE/fel-work" \
            bash scripts/build-fel-deps.sh

      - name: Verify FEL deps
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/fel-prefix/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          # ffmpeg CLI must load OUR libavcodec (the prefix), not a brew one.
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/fel-prefix/lib:${DYLD_LIBRARY_PATH:-}"
          pkg-config --atleast-version=7.370 libplacebo
          echo "libplacebo $(pkg-config --modversion libplacebo)"
          "$GITHUB_WORKSPACE/fel-prefix/bin/ffmpeg" -hide_banner -bsfs | grep -q dovi_split

      # Replaces brew libbluray (bdj_jar=disabled, no JVM linkage). Installs into
      # the FEL prefix so the shadower PKG_CONFIG_PATH wins for the mpv meson
      # build and the dylib relocator later finds our libbluray. The setup-java
      # step above exposes JAVA_HOME for the jar build.
      - name: Build libbluray with BD-J (libbluray.jar + JVM linkage)
        run: |
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/fel-prefix/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/fel-prefix/lib:${DYLD_LIBRARY_PATH:-}"
          echo "JAVA_HOME=$JAVA_HOME"
          # /usr/libexec/java_home on CI runners sometimes points at the system
          # VM; prefer the setup-java-installed JDK explicitly.
          PREFIX="$GITHUB_WORKSPACE/fel-prefix" \
          JAVA_HOME="$JAVA_HOME" \
            bash scripts/build-libbluray-bdj.sh

      # Bundle a jlinked JRE (NOT just java.base) so users don't need a system
      # install. MODULE RATIONALE — see Linux jlink step comment: libbluray
      # 1.5.1 patches BOTH java.base (j2se jar) and java.desktop (awt jar), so
      # a java.base-only JRE triggers ResolutionException. We also need
      # java.rmi (IxcRegistryImpl) / java.xml (FontIndex javax.xml) /
      # java.logging / java.prefs for the module graph to stay consistent.
      # macOS home: $JRE/lib/server/libjvm.dylib (flat layout, no Contents).
      - name: Produce jlink jre (java.base+desktop+xml+logging+prefs+rmi) for macOS BD-J
        run: |
          JR="$GITHUB_WORKSPACE/fel-prefix/share/libbluray/jre"
          # The restored fel-prefix cache can already carry a previously jlinked
          # jre under share/libbluray/jre. jlink refuses a pre-existing (non-empty)
          # --output dir with "directory already exists", failing the build on a
          # cache hit. Regenerate from a clean slate (safe: jre is rebuilt
          # deterministically below; this only touches the workspace copy).
          rm -rf "$JR"
          # jlink on macOS produces a JDK-style layout (no Contents wrapper
          # unless we build a full .app). Keep it flat so libbluray's dlopen
          # probe succeeds with BLURAY_JVM_LIB_PATH pointing at lib/server.
          jlink --add-modules java.base,java.desktop,java.xml,java.logging,java.prefs,java.rmi \
                --output "$JR" \
                --strip-debug --no-man-pages --no-header-files --compress=2
          # jlink output layout on mac: lib/server/libjvm.dylib
          JVMLIB="$JR/lib/server/libjvm.dylib"
          [ -f "$JVMLIB" ] \
            || { echo "!! jlink output missing lib/server/libjvm.dylib (looked: $JVMLIB)" >&2; \
                 find "$JR" -name 'libjvm*' -type f; exit 1; }
          "$JR/bin/java" --list-modules | grep -E '^java\.(base|desktop|xml|logging|prefs|rmi)@' \
            || { echo "!! jlink output missing one or more required modules" >&2; "$JR/bin/java" --list-modules; exit 1; }
          echo "jre size: $(du -sh "$JR" | cut -f1)"

      - name: Checkout Omniphony (renderer source)
        uses: actions/checkout@v5
        with:
          repository: mgth/Omniphony
          ref: ${{ env.OMNIPHONY_REF }}
          path: omniphony

      - name: Build liborender from source
        run: cargo build --release -p orender_ffi
        working-directory: omniphony/omniphony-renderer
        env:
          # This builds a *pinned external* source tree (Omniphony at
          # OMNIPHONY_REF), so lint policy there is not ours to enforce: an
          # immutable tag must stay buildable as rustc grows new lints.
          # dead_code in particular fires on liborender's dormant
          # artifact-evaluator path, which is reachable only through code the
          # FFI build never links.
          RUSTFLAGS: -D warnings -A dead_code

      - name: Install liborender into sysroot
        run: |
          mkdir -p sysroot/usr/lib sysroot/usr/include sysroot/usr/lib/pkgconfig
          rel=omniphony/omniphony-renderer/target/release
          cp "$rel/liborender.dylib" sysroot/usr/lib/liborender.dylib
          cp omniphony/omniphony-renderer/orender_ffi/include/orender.h sysroot/usr/include/orender.h
          cat > sysroot/usr/lib/pkgconfig/orender.pc <<EOF
          prefix=${{ github.workspace }}/sysroot/usr
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: orender
          Description: Omniphony renderer C library
          Version: 0.99.0
          Libs: -L\${libdir} -lorender
          Cflags: -I\${includedir}
          EOF

      - name: Apply orender patches onto mpv master
        run: |
          bash scripts/apply-patches-master.sh
          src="$(ls -d build/mpv-master-* | grep -v 'mpv-master-clone$' | head -n1)"
          echo "MPV_DIR=$src" >> "$GITHUB_ENV"

      - name: Build mpv (linked against FEL prefix)
        run: |
          PREFIX="$GITHUB_WORKSPACE/fel-prefix"
          # FEL prefix FIRST so its libplacebo/ffmpeg shadow brew's; then orender;
          # then brew (incl. vulkan-loader for the GUI Vulkan/MoltenVK stack).
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:${{ github.workspace }}/sysroot/usr/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig"
          export DYLD_LIBRARY_PATH="$PREFIX/lib:${{ github.workspace }}/sysroot/usr/lib"
          export PATH="$PREFIX/bin:$PATH"
          cd "$MPV_DIR"
          # mpv-player/mpv carries a non-v lightweight tag (`git-release`) that
          # `git describe --tags` resolves to, so mpv's generated version.h lacks
          # the leading `v` that master's osxbundle.py bundle_version() regex
          # requires — `re.findall(...)[0]` then dies with IndexError during
          # macos-bundle. Drop a v-tag at HEAD so describe yields a v-version
          # (it's distance 0, closer than git-release). FEL/master-only; the
          # v0.41.0 tarball builds already carry the v.
          ver=$(cat MPV_VERSION 2>/dev/null); git tag -f "v${ver%-UNKNOWN}-fel" HEAD >/dev/null 2>&1 || true
          # No CUDA/VA-API on macOS; Vulkan -> MoltenVK is the gpu-next path.
          # libbluray/dvdnav (BD/DVD/ISO) from brew. Force cocoa/swift/vulkan so the
          # GUI display stack is built; mpv's macos-bundle relocates everything next.
          meson setup _b -Dorender=enabled -Dvulkan=enabled \
            -Dlibbluray=enabled -Ddvdnav=enabled \
            -Dcocoa=enabled -Dswift-build=enabled
          meson compile -C _b
          echo "== mpv libplacebo linkage =="
          otool -L _b/mpv | grep -E 'libplacebo|libavcodec' || true
          otool -L _b/mpv | grep -q "$PREFIX/lib/libplacebo" \
            || { echo "!! mpv did not link the FEL libplacebo in $PREFIX" >&2; exit 1; }
          # Smoke: the binary + its whole dylib graph must load.
          _b/mpv --version
          _b/mpv --gpu-api=help | grep -qi vulkan \
            || echo "!! warning: vulkan gpu-api not listed (MoltenVK detection?)" >&2

      - name: Bundle into mpv.app (mpv's native macos-bundle)
        run: |
          # mpv's upstream osxbundle.py + dylib_unhell.py relocate every dylib
          # (liborender + the from-source FEL libplacebo/ffmpeg + brew deps) into
          # the app and wire MoltenVK + its ICD correctly — the same fix validated
          # for the stable release (#22/#37). FEL prefix first on PKG_CONFIG_PATH
          # so dylib_unhell's optional `pkg-config vulkan` probe resolves.
          PREFIX="$GITHUB_WORKSPACE/fel-prefix"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:${{ github.workspace }}/sysroot/usr/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig"
          cd "$MPV_DIR"
          # (version.h already carries a v-prefix — the build step tagged HEAD
          # with a v-version so `git describe` yields one; see that step's note.)
          meson compile -C _b macos-bundle   # -> _b/mpv.app

          # dylib_unhell relocates the Homebrew deps but leaves our from-source
          # FEL libplacebo/ffmpeg/libbluray (under $PREFIX/fel-prefix) referenced
          # by absolute path — they'd be missing on a clean Mac. Pull those (and
          # any transitive deps) into the bundle's lib dir, matching
          # dylib_unhell's layout (@executable_path/lib), with a small recursive
          # worklist. Runs before the Brand step's codesign + leak gate.
          APP=_b/mpv.app
          LIBDIR="$APP/Contents/MacOS/lib"; mkdir -p "$LIBDIR"
          worklist=("$APP/Contents/MacOS/mpv")
          for f in "$LIBDIR"/*.dylib; do [ -f "$f" ] && worklist+=("$f"); done
          while [ ${#worklist[@]} -gt 0 ]; do
            obj="${worklist[0]}"; worklist=("${worklist[@]:1}")
            while read -r ref; do
              base=$(basename "$ref")
              if [ ! -f "$LIBDIR/$base" ]; then
                real="$ref"; [ -f "$real" ] || real="$PREFIX/lib/$base"
                [ -f "$real" ] || { echo "  ! NOT FOUND: $ref" >&2; continue; }
                cp "$real" "$LIBDIR/$base"; chmod u+w "$LIBDIR/$base"
                install_name_tool -id "@executable_path/lib/$base" "$LIBDIR/$base"
                worklist+=("$LIBDIR/$base"); echo "  + relocated $base"
              fi
              install_name_tool -change "$ref" "@executable_path/lib/$base" "$obj" 2>/dev/null || true
            done < <(otool -L "$obj" | awk 'NR>1 {print $1}' | grep -E "^($PREFIX|/opt/homebrew|/usr/local)/")
          done

          # --- BD-J: 3 jars + jlinked 6-module JRE --------------------------
          # libbluray dlopen's the JVM via a few env-var probes (BLURAY_JVM_HOME,
          # BLURAY_JVM_LIB_PATH, JAVA_HOME/lib). It also looks for libbluray.jar
          # relative to its own install prefix — since we relink libbluray.dylib
          # into @executable_path/lib we drop the jars + jre under
          # Contents/Resources/libbluray/ and set LIBBLURAY_CP/JAVA_HOME from a
          # tiny launcher wrapper (the env vars are checked in-process; passing
          # them from a shim is the simplest portable fix).
          #
          # NOTE on THREE jars (libbluray 1.5.1 meson -Dbdj_jar=enabled):
          #   1. libbluray-j2se-VERSION.jar     → non-AWT BD-J classes, --patch-module java.base
          #   2. libbluray-awt-j2se-VERSION.jar → ONLY java/awt/** sun/**, --patch-module java.desktop
          #   3. libbluray.jar                  → byte-identical copy of (1) for legacy fallback callers
          #
          # Wrapper must pass LIBBLURAY_CP = (1) the VERSIONED j2se jar name,
          # because libbluray's internal _find_libbluray_jar1() derives the awt
          # jar (2)'s path from the j2se jar (1)'s name via a fixed string-slice
          # formula. Renaming the jar or passing the unversioned libbluray.jar
          # breaks that formula and results in "libbluray.jar: 0" in the log.
          RES="$APP/Contents/Resources/libbluray"; mkdir -p "$RES"
          if ls "$PREFIX/share/libbluray"/libbluray-j2se-*.jar >/dev/null 2>&1; then
            cp "$PREFIX/share/libbluray"/libbluray-j2se-*.jar "$RES/"
            J2SE_NAME="$(ls "$RES"/libbluray-j2se-*.jar | xargs -n1 basename)"
            echo "  + $J2SE_NAME ($(du -h "$RES/$J2SE_NAME" | cut -f1))"
            if ls "$PREFIX/share/libbluray"/libbluray-awt-j2se-*.jar >/dev/null 2>&1; then
              cp "$PREFIX/share/libbluray"/libbluray-awt-j2se-*.jar "$RES/"
              AWT_NAME="$(ls "$RES"/libbluray-awt-j2se-*.jar | xargs -n1 basename)"
              echo "  + $AWT_NAME ($(du -h "$RES/$AWT_NAME" | cut -f1))"
            fi
            if [ -f "$PREFIX/share/libbluray/libbluray.jar" ]; then
              cp "$PREFIX/share/libbluray/libbluray.jar" "$RES/"
              echo "  + libbluray.jar fallback ($(du -h "$RES/libbluray.jar" | cut -f1))"
            fi
          fi
          JRE_DST="$RES/jre"
          if [ -d "$PREFIX/share/libbluray/jre" ] && \
             find "$PREFIX/share/libbluray/jre" -name 'libjvm*' -type f | grep -q .; then
            cp -R "$PREFIX/share/libbluray/jre" "$JRE_DST"
            # Rewrite absolute install_names inside the jlinked JRE's dylibs.
            # jlink produces flat lib/ dylibs referenced by @rpath/libjli.dylib
            # — flattening them into @loader_path/. suffices for libbluray's
            # dlopen of libjvm.dylib (it's the leaf entry point).
            if [ -f "$JRE_DST/lib/server/libjvm.dylib" ]; then
              for d in "$JRE_DST/lib/"*.dylib "$JRE_DST/lib/server/"*.dylib; do
                [ -f "$d" ] || continue
                # make ids @loader_path-based and rewrite inter-references
                id="@loader_path/$(basename "$d")"
                install_name_tool -id "$id" "$d" 2>/dev/null || true
                for r in $(otool -L "$d" | awk 'NR>1{print $1}' | grep -E "^($PREFIX|/opt/homebrew|/usr/local|${JAVA_HOME:-/no})"); do
                  b="$(basename "$r")"
                  # libjli.dylib is a sibling in lib/
                  install_name_tool -change "$r" "@loader_path/$b" "$d" 2>/dev/null || true
                done
              done
              echo "  + jre (6-mod: base/desktop/xml/logging/prefs/rmi, $(du -sh "$JRE_DST" | cut -f1))"
            else
              echo "  ! warning: jre missing lib/server/libjvm.dylib — skipping bundle-in" >&2
            fi
          fi
          # Drop a one-liner in Resources so we can confirm bundling later.
          ls -la "$RES/" | tee "$RES/.bundled_bdj" || true

      - name: Brand, verify and package the .app
        run: |
          cd "$MPV_DIR/_b"
          mv mpv.app mpv-omniphony.app
          APP=mpv-omniphony.app
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Set :CFBundleIdentifier fr.mgth.mpv-omniphony" "$APP/Contents/Info.plist"
          "$PB" -c "Set :CFBundleName mpv-omniphony"               "$APP/Contents/Info.plist"
          "$PB" -c "Add :CFBundleDisplayName string mpv-omniphony" "$APP/Contents/Info.plist" 2>/dev/null || true

          # --- BD-J launcher wrapper -----------------------------------------
          # Replace the mpv executable with a POSIX sh shim (checked into
          # scripts/mpv-bdj-launcher-macos.sh) that sets BLURAY_JVM_LIB_PATH /
          # LIBBLURAY_CP / JAVA_HOME before exec'ing the real binary.
          # The shim does NOT depend on working dir — uses dirname "$0".
          BIN="$APP/Contents/MacOS"
          if [ -f "$BIN/mpv" ] && [ ! -L "$BIN/mpv" ]; then
            mv "$BIN/mpv" "$BIN/mpv-bin"
            cp "${GITHUB_WORKSPACE}/scripts/mpv-bdj-launcher-macos.sh" "$BIN/mpv"
            chmod +x "$BIN/mpv"
            echo "  + BD-J launcher shim installed (wrapper mpv -> mpv-bin)"
          fi

          # BDJ presence assertions — fail if any of the 3 jars or the jvm
          # ended up missing (the user asked specifically for BD-J). We assert
          # (1) versioned j2se jar present, (2) versioned awt jar present,
          # (3) fallback libbluray.jar present, (4) jre has libjvm.
          J2SE_CNT=$(find "$APP/Contents/Resources/libbluray" -maxdepth 1 -name 'libbluray-j2se-*.jar' -type f | wc -l | tr -d ' ')
          AWT_CNT=$(find "$APP/Contents/Resources/libbluray" -maxdepth 1 -name 'libbluray-awt-j2se-*.jar' -type f | wc -l | tr -d ' ')
          [ "$J2SE_CNT" -ge 1 ] \
            || { echo "!! BD-J versioned libbluray-j2se-VERSION.jar not bundled in Resources/libbluray/ (found $J2SE_CNT)" >&2; exit 1; }
          [ "$AWT_CNT" -ge 1 ] \
            || { echo "!! BD-J versioned libbluray-awt-j2se-VERSION.jar not bundled in Resources/libbluray/ (found $AWT_CNT)" >&2; exit 1; }
          test -f "$APP/Contents/Resources/libbluray/libbluray.jar" \
            || { echo "!! BD-J fallback libbluray.jar not bundled into Resources/libbluray/" >&2; exit 1; }
          find "$APP/Contents/Resources/libbluray/jre" -name 'libjvm*' -type f | grep -q . \
            || { echo "!! BD-J jre bundle has no libjvm" >&2; find "$APP/Contents/Resources/libbluray/" || true; exit 1; }
          echo "  + bdj bundle ok: j2se=$J2SE_CNT awt=$AWT_CNT fallback=present libjvm=present"

          codesign --force --deep --sign - "$APP"
          "./$APP/Contents/MacOS/mpv-bin" --version
          # Smoke: the wrapper must also work (it's what Finder/Spotlight use
          # and what the CLI invokes).
          "./$APP/Contents/MacOS/mpv" --version >/dev/null \
            || { echo "!! wrapper launcher failed to execute" >&2; exit 1; }
          "./$APP/Contents/MacOS/mpv-bin" --gpu-api=help | grep -qi vulkan \
            || echo "!! warning: vulkan gpu-api not listed (MoltenVK detection?)" >&2
          # --- MoltenVK ICD cleanout ------------------------------------------------
          # Vulkan loader scans ALL ICD dirs; bundling MoltenVK alongside brew's
          # copy causes TWO ObjC class registrations (MoltenVK is ObjC-based),
          # triggering "Class X implemented in both ... mysteriously crash".
          # We deliberately remove anything macos-bundle pulled in — Vulkan
          # loader finds brew's /opt/homebrew/etc/vulkan/icd.d/MoltenVK_icd.json
          # at runtime automatically (macOS has no sandboxing here).
          rm -rf "$APP/Contents/Frameworks/libMoltenVK.dylib" \
                 "$APP/Contents/Resources/vulkan/icd.d" \
                 "$APP/Contents/Frameworks/loader"
          echo "  + MoltenVK ICD/dylib cleaned (Vulkan loader uses brew copy)"

          # --- Smoke tests ---------------------------------------------------
          # Generate a 5-frame testsrc MP4 with our from-source fel-prefix ffmpeg; use it to verify
          # both the null backend (basic binary health) and gpu-next + Vulkan
          # rendering (our most fragile stack — catches MoltenVK crashes early).
          TESTFILE="/tmp/mpv-smoke-test.mp4"
          "${GITHUB_WORKSPACE}/fel-prefix/bin/ffmpeg" -hide_banner -loglevel error -f lavfi \
                 -i testsrc=size=64x64:rate=10 \
                 -frames:v 5 -c:v libx264 -pix_fmt yuv420p \
                 -y "$TESTFILE" \
            || { echo "!! ffmpeg test pattern generation failed" >&2; exit 1; }
          echo "  + testfile: $TESTFILE ($(du -h "$TESTFILE" | cut -f1))"

          # Test 1: null vo — binary loads, dylib graph resolves
          "./$APP/Contents/MacOS/mpv-bin" --no-config \
              --vo=null --ao=null --frames=3 --quiet \
              "$TESTFILE" >/tmp/mpv-smoke1.log 2>&1
          rc=$?
          [ $rc -eq 0 ] || { echo "!! smoke1 (vo=null) failed rc=$rc:"; cat /tmp/mpv-smoke1.log; exit 1; }
          echo "  + smoke1 (vo=null): exit 0"

          # Test 2: gpu-next + Vulkan — the full rendering chain. This is where
          # a crashy libplacebo or MoltenVK configuration surfaces.
          "./$APP/Contents/MacOS/mpv-bin" --no-config \
              --vo=gpu-next --gpu-api=vulkan --ao=null \
              --frames=3 --quiet --no-cache \
              "$TESTFILE" >/tmp/mpv-smoke2.log 2>&1
          rc=$?
          [ $rc -eq 0 ] || { echo "!! smoke2 (vo=gpu-next+vulkan) failed rc=$rc:"; cat /tmp/mpv-smoke2.log; exit 1; }
          echo "  + smoke2 (vo=gpu-next+vulkan): exit 0"

          # Catch any absolute brew/local OR un-relocated FEL-prefix dependency.
          # The leak check no longer excludes MoltenVK — we removed ours above,
          # so any leftover reference is a genuine relocation failure.
          leak=$(find "$APP" -type f \( -name '*.dylib' -o -name mpv-bin \) -print0 \
                 | xargs -0 -I{} sh -c 'otool -L "{}" | awk "NR>1{print \$1}"' \
                 | grep -E "^(/opt/homebrew|/usr/local|$GITHUB_WORKSPACE)" \
                 | sort -u || true)
          [ -z "$leak" ] || { echo "!! un-bundled absolute references remain:" >&2; echo "$leak" >&2; exit 1; }
          zip -ry "${GITHUB_WORKSPACE}/mpv-omniphony-fel-macos-arm64.zip" "$APP"

      - uses: actions/upload-artifact@v6
        with:
          name: mpv-omniphony-fel-macos-arm64
          path: mpv-omniphony-fel-macos-arm64.zip

  publish-beta:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mpv-omniphony-fel-macos-arm64

      - name: Publish master beta pre-release
        uses: softprops/action-gh-release@v3
        with:
          # Publish to THIS fork (kenken7429/mpv-omniphony) with the
          # auto-generated GITHUB_TOKEN (contents:write granted above).
          # To publish to the upstream download hub instead, set the
          # OMNIPHONY_RELEASE_TOKEN secret (contents:write on mgth/Omniphony)
          # and restore `repository: mgth/Omniphony`.
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: mpv-${{ github.ref_name }}
          name: 'mpv-omniphony ${{ github.ref_name }} — master (spatial audio + enhanced video-range)'
          prerelease: true
          make_latest: false
          body: |
            Master-tracking build of mpv-omniphony: mpv **master** + the orender
            spatial-audio patches, with **native enhanced video-range playback**.
            liborender from Omniphony `${{ env.OMNIPHONY_REF }}`.
            **Beta — NOT a stable release.**

            **NOT bundled:** the decoder bridge plugin (`*_bridge.dll` / `.so`).
            Provide it via `--ad-orender-bridge-path=<absolute path>` or drop it
            next to `mpv(.exe)`.

            **macOS (Apple Silicon, experimental):** `…-fel-macos-arm64.zip` is
            self-contained (all dylibs bundled). Enhanced video-range rendering goes through
            Vulkan→MoltenVK, which is not yet fully conformant on Apple Silicon —
            treat it as experimental. Clear the download quarantine
            (`xattr -dr com.apple.quarantine mpv`), and point the Vulkan loader at
            the bundled MoltenVK ICD:
            `VK_ICD_FILENAMES=<dir>/share/vulkan/icd.d/MoltenVK_icd.json`.

            **Credits:** the enhanced video-range support is upstream mpv work by
            [kasper93](https://github.com/kasper93) (Kacper Michajłow) — mpv
            [PR #17932](https://github.com/mpv-player/mpv/pull/17932), merged into
            mpv master (v0.42.0), building on the matching libplacebo + ffmpeg
            upstream support. This build tracks upstream master and packages it.
          files: |
            mpv-omniphony-fel-macos-arm64.zip

name: Release

# Triggered by a v* tag.
# Cross-compiles mpv (with our ad_orender patches) for Linux and Windows,
# bundles each with the matching liborender release artifacts, and creates a
# draft GitHub release.
#
# truehd_bridge is NOT bundled — Dolby licensing requires the user to download
# it separately (see README).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  MPV_TAG: v0.41.0
  LIBORENDER_TAG: liborender-v0.2.0

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mpv build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config gcc \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libass-dev libplacebo-dev liblua5.2-dev libx11-dev

      - name: Download liborender Linux release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p sysroot/usr/lib sysroot/usr/include sysroot/usr/lib/pkgconfig
          gh release download "$LIBORENDER_TAG" -R mgth/Omniphony \
            --pattern "liborender-*-linux-x86_64.zip" -D /tmp/liborender
          unzip -d /tmp/liborender /tmp/liborender/liborender-*-linux-x86_64.zip
          cp /tmp/liborender/liborender.so sysroot/usr/lib/liborender.so.0
          ln -sf liborender.so.0 sysroot/usr/lib/liborender.so
          cp /tmp/liborender/orender.h sysroot/usr/include/orender.h
          # Hand-write a minimal pkg-config so mpv's meson finds liborender.
          ver="${LIBORENDER_TAG#liborender-v}"
          cat > sysroot/usr/lib/pkgconfig/orender.pc <<EOF
          prefix=${{ github.workspace }}/sysroot/usr
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: orender
          Description: Omniphony renderer C library
          Version: ${ver}
          Libs: -L\${libdir} -lorender
          Cflags: -I\${includedir}
          EOF

      - name: Apply patches onto mpv
        run: bash scripts/apply-patches.sh "$MPV_TAG"

      - name: Build mpv with ad_orender
        run: |
          export PKG_CONFIG_PATH="${{ github.workspace }}/sysroot/usr/lib/pkgconfig"
          export LD_LIBRARY_PATH="${{ github.workspace }}/sysroot/usr/lib"
          cd "build/mpv-${MPV_TAG}"
          meson setup _b -Dorender=enabled
          meson compile -C _b

      - name: Package (zip)
        run: |
          mkdir -p staging
          cp "build/mpv-${MPV_TAG}/_b/mpv" staging/
          cp sysroot/usr/lib/liborender.so.0 staging/
          cp sysroot/usr/include/orender.h staging/
          cp README.md staging/
          cd staging
          zip "../mpv-omniphony-${GITHUB_REF_NAME}-linux-x86_64.zip" \
            mpv liborender.so.0 orender.h README.md

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-omniphony-linux-x86_64
          path: mpv-omniphony-*-linux-x86_64.zip

  build-windows:
    runs-on: ubuntu-latest
    # Arch base + Martchus's mingw-w64 binary repo gives us pre-built MinGW
    # builds of ffmpeg, libplacebo, libass, lua — the libs mpv needs that
    # apt's mingw-w64-* packages don't carry.
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Arch + Martchus mingw-w64 repo
        run: |
          pacman-key --init
          # Allow unsigned downloads from the Martchus binary repo (it ships
          # its own signing infra; for CI we trust-on-first-use rather than
          # importing keys every run).
          cat >> /etc/pacman.conf <<'EOF'

          [ownstuff]
          SigLevel = Optional TrustAll
          Server = https://martchus.no-ip.biz/repo/arch/$repo/os/$arch
          EOF
          pacman -Syu --noconfirm

      - name: Install MinGW toolchain + mpv deps
        run: |
          pacman -S --noconfirm --needed \
            base-devel git unzip \
            mingw-w64-gcc \
            mingw-w64-pkg-config \
            mingw-w64-meson \
            mingw-w64-ffmpeg \
            mingw-w64-libplacebo \
            mingw-w64-libass \
            mingw-w64-lua51

      - name: Download liborender Windows release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh isn't in Arch by default — use curl with the github API token
          mkdir -p /tmp/liborender sysroot/mingw64/lib sysroot/mingw64/include \
                   sysroot/mingw64/lib/pkgconfig
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/mgth/Omniphony/releases/tags/$LIBORENDER_TAG" \
            > /tmp/release.json
          url=$(grep -oE '"browser_download_url":\s*"[^"]+-windows-x86_64\.zip"' /tmp/release.json | head -1 | sed 's/.*: *"//;s/"$//')
          curl -sL "$url" -o /tmp/liborender.zip
          unzip -d /tmp/liborender /tmp/liborender.zip
          cp /tmp/liborender/orender.dll sysroot/mingw64/lib/
          cp /tmp/liborender/orender.h   sysroot/mingw64/include/
          # On Windows we link against the .dll's import library — but cdylib
          # produces orender.dll.lib via rustc, not shipped here. For MinGW
          # the .dll itself works as the import target with -lorender.
          ver="${LIBORENDER_TAG#liborender-v}"
          cat > sysroot/mingw64/lib/pkgconfig/orender.pc <<EOF
          prefix=/sysroot/mingw64
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: orender
          Description: Omniphony renderer C library
          Version: ${ver}
          Libs: -L\${libdir} -lorender
          Cflags: -I\${includedir}
          EOF

      - name: Apply patches onto mpv
        run: bash scripts/apply-patches.sh "$MPV_TAG"

      - name: Cross-compile mpv (MinGW)
        run: |
          export PKG_CONFIG_PATH="${{ github.workspace }}/sysroot/mingw64/lib/pkgconfig:/usr/x86_64-w64-mingw32/lib/pkgconfig"
          cd "build/mpv-${MPV_TAG}"
          x86_64-w64-mingw32-meson setup _b -Dorender=enabled
          meson compile -C _b

      - name: Package (zip)
        run: |
          mkdir -p staging
          cp "build/mpv-${MPV_TAG}/_b/mpv.exe" staging/
          cp sysroot/mingw64/lib/orender.dll staging/
          cp sysroot/mingw64/include/orender.h staging/
          cp README.md staging/
          # Copy MinGW runtime DLLs mpv depends on
          for dll in $(x86_64-w64-mingw32-objdump -p staging/mpv.exe | grep 'DLL Name' | awk '{print $3}'); do
            for d in /usr/x86_64-w64-mingw32/bin /sysroot/mingw64/bin; do
              [ -f "$d/$dll" ] && cp "$d/$dll" staging/ && break
            done
          done
          cd staging
          zip -r "../mpv-omniphony-${GITHUB_REF_NAME}-windows-x86_64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: mpv-omniphony-windows-x86_64
          path: mpv-omniphony-*-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mpv-omniphony-linux-x86_64

      - uses: actions/download-artifact@v4
        with:
          name: mpv-omniphony-windows-x86_64

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          body: |
            mpv-omniphony ${{ github.ref_name }} — mpv with the ad_orender Atmos decoder.

            **What's in each archive:** `mpv` (or `mpv.exe`), `liborender.so.0` /
            `orender.dll`, `orender.h`, plus the bundled MinGW runtime DLLs on
            Windows.

            **NOT bundled:** `truehd_bridge.so` / `truehd_bridge.dll` — the
            TrueHD/E-AC3 decoder bridge. Dolby licensing means users must
            obtain it themselves from
            [harletty-bridge](https://github.com/harletty/harletty-bridge/releases),
            and point mpv at it with
            `--ad-orender-bridge-path=/path/to/truehd_bridge.{so,dll}`.

            Built against liborender ${{ env.LIBORENDER_TAG }}.
          files: |
            mpv-omniphony-*-linux-x86_64.zip
            mpv-omniphony-*-windows-x86_64.zip

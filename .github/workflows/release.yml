name: Release

# Triggered by a v* tag.
# Builds mpv (with our ad_orender patches) for Linux, Windows (MinGW cross) and
# macOS arm64 (native), bundles each with the matching liborender artifacts, and
# creates a draft GitHub release.
#
# The decoder bridge is NOT bundled — it carries licensing constraints that
# require the user to download it separately (see README).
on:
  push:
    tags:
      - 'v*'
      # FEL beta tags (e.g. v0.4.0-fel-beta.1) are built + published by
      # build-fel.yml on the master track; keep them off the stable release.
      - '!*-fel*'
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version label used in the asset filenames (e.g. v0.5.0). Defaults to
          the ref name. Set it when rebuilding an asset for an already-published
          release.
        required: false
        default: ''

env:
  MPV_TAG: v0.41.0
  # Omniphony tag liborender is built from, in lockstep with the renderer.
  # We build liborender FROM SOURCE here rather than downloading a pinned
  # prebuilt release: that keeps orender.dll/.so and orender.h coherent by
  # construction, and removes the stale-prebuilt skew that made mpv silently
  # ship an old liborender (config parsed differently → default room). Bump
  # this one line on each release.
  OMNIPHONY_REF: v0.5.2
  # Version label baked into the asset filenames: the tag on a tag push, the
  # `version` input on a manual run. The zip steps flatten any '/' — a branch
  # ref name would otherwise make `zip` write into a directory that isn't there.
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install mpv build deps (Homebrew)
        run: |
          brew update
          # molten-vk + vulkan-loader provide the Vulkan-on-Metal runtime that
          # libplacebo's gpu-next path needs on Apple Silicon (there is no native
          # Vulkan driver on macOS). They are bundled into the artifact below so
          # the build renders on a clean Mac without a system-wide Vulkan install.
          # libbluray/libdvdnav add BD/DVD/ISO playback (also bundled below).
          brew install meson ninja pkg-config ffmpeg libass libplacebo luajit \
            molten-vk vulkan-loader vulkan-headers \
            libbluray libdvdnav libdvdread

      - name: Checkout Omniphony (renderer source)
        uses: actions/checkout@v5
        with:
          repository: mgth/Omniphony
          ref: ${{ env.OMNIPHONY_REF }}
          path: omniphony

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build liborender from source
        # orender_ffi only pulls orender_engine (audio-free) — same minimal
        # build as the Linux/Windows liborender jobs.
        run: cargo build --release -p orender_ffi
        working-directory: omniphony/omniphony-renderer
        env:
          # This builds a *pinned external* source tree (Omniphony at
          # OMNIPHONY_REF), so lint policy there is not ours to enforce: an
          # immutable tag must stay buildable as rustc grows new lints.
          # dead_code in particular fires on liborender's dormant
          # artifact-evaluator path, which is reachable only through code the
          # FFI build never links.
          RUSTFLAGS: -D warnings -A dead_code

      - name: Stage liborender (bundled fallback)
        # Runtime dependency only: mpv dlopens it, preferring a Studio-deployed
        # engine and falling back to the copy dropped into Contents/MacOS below.
        run: |
          mkdir -p sysroot/usr/lib
          cp omniphony/omniphony-renderer/target/release/liborender.dylib \
             sysroot/usr/lib/liborender.dylib

      - name: Apply patches onto mpv
        run: bash scripts/apply-patches.sh "$MPV_TAG"

      - name: Build mpv with ad_orender
        run: |
          # Homebrew's pkgconfig (incl. vulkan-loader) so meson finds the brew
          # ffmpeg/libass/libplacebo/luajit and the Vulkan loader; liborender is
          # a pure runtime dependency and needs nothing here. cocoa/swift/vulkan
          # are auto-on; force them so the GUI + Vulkan(MoltenVK) display stack
          # is built and a silent disable becomes a loud failure (no-video
          # bundles are the whole bug).
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cd "build/mpv-${MPV_TAG}"
          # Disc playback (BD/DVD/ISO) via brew libbluray (pulls libudfread → raw
          # BD-ISO) + libdvdnav. mpv's own macos-bundle target relocates these and
          # every other dylib in the next step.
          meson setup _b -Dorender=enabled -Dlibbluray=enabled -Ddvdnav=enabled \
            -Dcocoa=enabled -Dswift-build=enabled -Dvulkan=enabled
          meson compile -C _b

      - name: Bundle into mpv.app (mpv's native macos-bundle)
        run: |
          # Use mpv's upstream TOOLS/osxbundle.py + dylib_unhell.py instead of a
          # hand-rolled bundler: it relocates every non-system dylib (incl.
          # liborender + the whole brew ffmpeg/libass/libplacebo stack) into
          # Contents/MacOS/lib, and its process_vulkan_loader() copies libMoltenVK
          # into Contents/Frameworks and writes a CORRECT ICD into
          # Contents/Resources/vulkan/icd.d (library_path relative to Frameworks).
          # This is what makes the app genuinely self-contained — mpv loads its
          # OWN bundled ffmpeg, fixing the "libavcodec build vs runtime" mismatch
          # (#22). Same PKG_CONFIG_PATH as the build so dylib_unhell's optional
          # `pkg-config vulkan` probe resolves.
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix vulkan-loader)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cd "build/mpv-${MPV_TAG}"
          meson compile -C _b macos-bundle   # -> _b/mpv.app (category 'video')

      - name: Brand, verify and package the .app
        run: |
          cd "build/mpv-${MPV_TAG}/_b"
          mv mpv.app mpv-omniphony.app
          # osxbundle's Info.plist template hardcodes io.mpv/mpv; rebrand, then
          # re-sign (editing the plist invalidates the ad-hoc signature). The
          # inner executable stays `mpv`; only the bundle dir is renamed.
          PB=/usr/libexec/PlistBuddy
          "$PB" -c "Set :CFBundleIdentifier fr.mgth.mpv-omniphony" mpv-omniphony.app/Contents/Info.plist
          "$PB" -c "Set :CFBundleName mpv-omniphony"               mpv-omniphony.app/Contents/Info.plist
          "$PB" -c "Add :CFBundleDisplayName string mpv-omniphony" mpv-omniphony.app/Contents/Info.plist 2>/dev/null || true

          # mpv no longer links liborender, so the bundler does not relocate it;
          # drop the fallback copy next to the binary ourselves (the runtime
          # loader's exe-dir candidate is Contents/MacOS). Before the codesign:
          # adding files after signing would invalidate the signature.
          cp "$GITHUB_WORKSPACE/sysroot/usr/lib/liborender.dylib" \
             mpv-omniphony.app/Contents/MacOS/liborender.dylib

          codesign --force --deep --sign - mpv-omniphony.app

          # Smoke test — all the headless runner can do: binary loads, Vulkan is
          # listed, MoltenVK + ICD are bundled, and no residual absolute brew path
          # remains (the old leak gate, kept).
          ./mpv-omniphony.app/Contents/MacOS/mpv --version
          ./mpv-omniphony.app/Contents/MacOS/mpv --gpu-api=help | grep -qi vulkan \
            || echo "!! warning: vulkan gpu-api not listed (MoltenVK detection?)" >&2
          test -f mpv-omniphony.app/Contents/Frameworks/libMoltenVK.dylib \
            || { echo "!! libMoltenVK.dylib not bundled" >&2; exit 1; }
          test -f mpv-omniphony.app/Contents/Resources/vulkan/icd.d/MoltenVK_icd.json \
            || { echo "!! MoltenVK ICD not bundled" >&2; exit 1; }
          # The bundled libMoltenVK keeps its brew install *id* (otool line 2);
          # that's by design — it's dlopen'd via the ICD's relative library_path,
          # never linked — so exclude that one self-reference. Any OTHER absolute
          # brew/local path would be a real un-relocated dependency.
          leak=$(find mpv-omniphony.app -type f \( -name '*.dylib' -o -name mpv \) -print0 \
                 | xargs -0 -I{} sh -c 'otool -L "{}" | awk "NR>1{print \$1}"' \
                 | grep -E '^/(opt/homebrew|usr/local)' \
                 | grep -v '/libMoltenVK\.dylib$' | sort -u || true)
          [ -z "$leak" ] || { echo "!! un-bundled absolute references remain:" >&2; echo "$leak" >&2; exit 1; }
          codesign --verify --deep --strict mpv-omniphony.app || true

          # Single artifact: the .app. CLI users run mpv-omniphony.app/Contents/MacOS/mpv
          # (the binary needs Contents/Frameworks + Resources for MoltenVK/ICD).
          zip -ry "${GITHUB_WORKSPACE}/mpv-omniphony-${VERSION//\//-}-macos-arm64.zip" mpv-omniphony.app

      - uses: actions/upload-artifact@v6
        with:
          name: mpv-omniphony-macos-arm64
          path: mpv-omniphony-*-macos-arm64.zip

  release:
    # Tag pushes only. A manual run is a build (smoke test, or an asset for an
    # already-published release): it uploads artifacts and stops there, rather
    # than drafting a release named after a branch.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:



      - uses: actions/download-artifact@v7
        with:
          name: mpv-omniphony-macos-arm64

      # Publish the player bundles on THIS fork's Releases page. The auto-generated
      # GITHUB_TOKEN has contents:write on this repo only (granted by the
      # `permissions` block above); to publish to the upstream download hub
      # (mgth/Omniphony) instead, set the OMNIPHONY_RELEASE_TOKEN secret
      # (contents:write on mgth/Omniphony) and restore `repository: mgth/Omniphony`
      # plus a `target_commitish` resolve step.
      - name: Publish release on this fork
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: mpv-${{ github.ref_name }}
          draft: true
          name: mpv-omniphony ${{ github.ref_name }}
          body: |
            mpv-omniphony ${{ github.ref_name }} — mpv with the ad_orender
            spatial audio decoder.

            **What's in each archive:** `mpv` (or `mpv.exe`), a fallback engine
            library (`liborender.so.*` / `orender.dll`), `orender.h`, plus the
            bundled MinGW runtime DLLs on Windows. The live overlay is built
            into mpv itself — no script to install.

            **Engine loading:** mpv no longer links the engine — it loads
            liborender at runtime with an ABI version check, searching:
            `--ad-orender-library` / `$ORENDER_LIBRARY` → the engine deployed
            by Omniphony Studio (per-user data dir) → the copy bundled next to
            mpv → the system library path. Updating Omniphony Studio therefore
            updates the engine mpv uses, with no new mpv build; an
            incompatible library is rejected with a clear log line and mpv
            falls back to its native decoders.

            **macOS (Apple Silicon):** `…-macos-arm64.zip` contains a
            self-contained, double-clickable `mpv-omniphony.app` (built with
            mpv's own bundler — every dylib incl. ffmpeg and MoltenVK is bundled,
            no Homebrew required). CLI users run
            `mpv-omniphony.app/Contents/MacOS/mpv`. It is ad-hoc signed, not
            notarized, so the first launch is blocked by Gatekeeper — clear the
            download quarantine once with
            `xattr -dr com.apple.quarantine /path/to/mpv-omniphony.app`, or
            right-click → Open the first time.



            **Upgrading?** The overlay is now built in: delete any
            `omniphony-overlay.lua` you previously copied into your mpv
            `scripts/` directory. A leftover copy is harmless (it self-disables
            on these PUC-Lua builds), but it is no longer needed.

            **NOT bundled:** the decoder bridge plugin
            (`omniphony_bridge.so` / `.dll`). Licensing constraints on the
            underlying codec mean users must obtain it themselves from
            [harletty-bridge](https://github.com/harletty/harletty-bridge/releases),
            and point mpv at it with
            `--ad-orender-bridge-path=/path/to/bridge.{so,dll,dylib}`.

            liborender built from source at Omniphony ${{ env.OMNIPHONY_REF }}.

            **License — GPL-3.0-or-later.** This build combines mpv
            (GPL-2.0-or-later) with liborender (GPL-3.0-or-later), so the
            combined work is GPLv3. Corresponding source: mpv
            `${{ env.MPV_TAG }}` + this repo's `patches/` at commit
            ${{ github.sha }}, and liborender at Omniphony
            `${{ env.OMNIPHONY_REF }}` (https://github.com/mgth/Omniphony).
            Bundled third-party libraries: see `THIRD-PARTY-NOTICES.md`.
          files: |
            mpv-omniphony-*-macos-arm64.zip
